[Handies]
; Los DFF y el runtime mantienen los 32 huesos nativos. Handies mezcla perfiles
; morph de dedos sin añadir huesos al HAnim ni reemplazar animaciones del ped.
Enabled=1

; Anima constantemente la geometría de dedos integrados del jugador y NPC,
; incluidas las señales de pandilla originales cuando su tarea nativa está activa.
Player=1
NPCs=1

; Velocidad de transición entre la pose relajada y el puño.
; Basis se conserva cuando no hay ninguna acción de mano. Los conductores
; aplican Grip en ambas manos mientras ocupan el asiento del conductor.
GripTransitionSpeed=0.12

; Velocidad de entrada y salida del gesto FUCKU.
FuckUTransitionSpeed=0.08

; Cada perfil elige por nombre una secuencia completa de ghands.ifp para cada
; mano. "None" deja esa mano en el blendshape automático relajado/puño.
; TimeMode=Ped sincroniza el avance normalizado con la animación corporal.
; TimeMode=Seconds usa directamente el tiempo de la asociación del ped.
; Loop, Speed, Weight y Priority pueden ajustarse independientemente.

[HandProfile.GangSign1]
Left=LHGsign1
Right=RHGsign1
TimeMode=Seconds
Loop=0
Speed=1.0
Weight=1.0
Priority=100

[HandProfile.GangSign1Left]
Left=LHGsign1
Right=None
TimeMode=Seconds
Loop=0
Speed=1.0
Weight=1.0
Priority=100

